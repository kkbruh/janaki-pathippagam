<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Janaki Pathipagam</title>
  <meta name="description" content="Devotional Hindu books — available online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Tamil:wght@400;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== Opening deity splash (fades away on load) ===== -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="splash-arch">
        <img id="splash-img" class="splash-img" alt="" />
      </div>
      <p id="splash-blessing" class="splash-blessing"></p>
      <p class="splash-choose">மொழியைத் தேர்ந்தெடுக்கவும் &middot; Choose your language</p>
      <div class="lang-choice">
        <button class="lang-enter" data-lang="ta">தமிழில் நுழையுங்கள்</button>
        <button class="lang-enter" data-lang="en">Enter in English</button>
      </div>
    </div>
  </div>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="brand">
      <img id="brand-logo" class="brand-logo" alt="" />
      <div class="brand-text">
        <h1 id="site-title" class="brand-title"></h1>
        <p id="site-tagline" class="brand-tagline"></p>
      </div>
    </div>
    <nav class="header-actions">
      <a href="#books" id="nav-books" class="nav-link"></a>
      <a href="#about" id="nav-about" class="nav-link"></a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button data-setlang="ta" class="lang-opt">தமிழ்</button>
        <button data-setlang="en" class="lang-opt">EN</button>
      </div>
      <button id="cart-toggle" class="cart-btn" aria-label="Open cart">
        <span class="cart-icon">🛒</span>
        <span id="cart-count" class="cart-count">0</span>
      </button>
    </nav>
  </header>

  <!-- ===== Hero ===== -->
  <section class="hero">
    <div class="hero-content">
      <p class="hero-om">&#2384;</p>
      <h2 id="hero-heading" class="hero-heading"></h2>
      <p id="hero-sub" class="hero-sub"></p>
      <a href="#books" id="hero-cta" class="hero-cta"></a>
    </div>
  </section>

  <!-- ===== Books shop ===== -->
  <main>
    <section id="books" class="shop">
      <h2 id="collection-title" class="section-title"></h2>
      <div id="book-grid" class="book-grid"><!-- books injected by app.js --></div>
    </section>

    <!-- ===== About (bottom of page) ===== -->
    <section id="about" class="about">
      <div class="about-inner">
        <img id="about-photo" class="about-photo" alt="Author" />
        <div class="about-text">
          <h2 id="about-heading" class="section-title"></h2>
          <div id="about-paragraphs"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-line"></p>
  </footer>

  <!-- ===== Corner accents (temple guardians) ===== -->
  <img id="corner-left" class="corner-accent corner-left" alt="" aria-hidden="true" />
  <img id="corner-right" class="corner-accent corner-right" alt="" aria-hidden="true" />

  <!-- ===== Cart drawer ===== -->
  <div id="cart-overlay" class="cart-overlay"></div>
  <aside id="cart-drawer" class="cart-drawer" aria-label="Your cart">
    <div class="cart-head">
      <h3 id="cart-title"></h3>
      <button id="cart-close" class="cart-close" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items" class="cart-items"><!-- items injected --></div>
    <div class="cart-foot">
      <div class="cart-total-row">
        <span id="cart-total-label"></span>
        <span id="cart-total"></span>
      </div>
      <p id="cart-note" class="cart-note"></p>
      <button id="inquire-whatsapp" class="inquire-btn wa"></button>
      <button id="inquire-email" class="inquire-btn email"></button>
    </div>
  </aside>

  <!-- ===== Book detail modal ===== -->
  <div id="detail-overlay" class="detail-overlay">
    <div class="detail-modal" role="dialog" aria-modal="true">
      <button id="detail-close" class="detail-close" aria-label="Close">✕</button>
      <div class="detail-body">
        <img id="detail-cover" class="detail-cover" alt="" />
        <div class="detail-info">
          <h3 id="detail-title"></h3>
          <p id="detail-subtitle" class="detail-subtitle"></p>
          <p id="detail-price" class="detail-price"></p>
          <p id="detail-desc" class="detail-desc"></p>
          <button id="detail-add" class="add-btn">Add to Order</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
