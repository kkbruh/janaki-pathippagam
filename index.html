<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ஜானகி பதிப்பகம் · Janaki Pathipagam</title>
  <meta name="description" content="Devotional Hindu books by Madurai S. Raghuraman — order over WhatsApp or email." />
  <link rel="icon" type="image/png" href="images/emblem.png" />
  <!-- Share preview (WhatsApp, Facebook, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Janaki Pathipagam" />
  <meta property="og:title" content="ஜானகி பதிப்பகம் · Janaki Pathipagam" />
  <meta property="og:description" content="மதுரை சு. ரகுராமனின் ஆன்மீக நூல்கள் — வாட்ஸ்ஆப்/மின்னஞ்சல் மூலம் ஆர்டர். Devotional books by Madurai S. Raghuraman." />
  <meta property="og:image" content="https://kkbruh.github.io/janaki-pathippagam/images/logo.png" />
  <meta property="og:url" content="https://kkbruh.github.io/janaki-pathippagam/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Tamil:wght@400;600&family=Tiro+Tamil:ital@0;1&family=Kavivanar&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=36" />
</head>
<body>

  <!-- ===== Divine intro: a god image fades in and out, then the door appears ===== -->
  <div id="intro" class="intro"><img id="intro-img" class="intro-img" alt="" /></div>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="brand">
      <img id="brand-logo" class="brand-logo" alt="" />
      <div class="brand-text">
        <h1 id="site-title" class="brand-title"></h1>
        <p id="site-tagline" class="brand-tagline"></p>
      </div>
    </div>
    <nav class="header-actions">
      <a href="#books" id="nav-books" class="nav-link"></a>
      <a href="#about" id="nav-about" class="nav-link"></a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button data-setlang="ta" class="lang-opt">தமிழ்</button>
        <button data-setlang="en" class="lang-opt">EN</button>
      </div>
      <button id="cart-toggle" class="cart-btn" aria-label="Open cart">
        <span class="cart-icon">🛒</span>
        <span id="cart-count" class="cart-count">0</span>
      </button>
    </nav>
  </header>

  <!-- ===== Hero ===== -->
  <section class="hero">
    <img id="corner-left" class="hero-saint hero-saint-left" alt="" aria-hidden="true" />
    <img id="corner-right" class="hero-saint hero-saint-right" alt="" aria-hidden="true" />
    <div class="hero-content">
      <p class="hero-om">&#2384;</p>
      <h2 id="hero-heading" class="hero-heading"></h2>
      <p id="hero-sub" class="hero-sub"></p>
      <a href="#books" id="hero-cta" class="hero-cta btn btn--gold"></a>
      <a href="#about" id="hero-about" class="hero-about"></a>
    </div>
  </section>

  <!-- ===== Books shop ===== -->
  <main>
    <section id="books" class="shop">
      <div class="shop-inner">
        <h2 id="collection-title" class="section-title"></h2>
        <div id="book-grid" class="book-grid"><!-- books injected by app.js --></div>
      </div>
    </section>

    <!-- ===== About (bottom of page) ===== -->
    <section id="about" class="about">
      <div class="about-inner">
        <h2 id="about-heading" class="section-title"></h2>
        <div class="about-frame">
          <div class="about-portrait">
            <img id="about-photo" class="about-photo" alt="Author" />
          </div>
          <h3 id="about-name" class="about-name"></h3>
          <p id="about-role" class="about-role"></p>
          <div class="about-divide" aria-hidden="true"></div>
          <div id="about-paragraphs" class="about-text"></div>
          <p id="about-bless" class="about-bless"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-line"></p>
  </footer>

  <!-- ===== Cart drawer ===== -->
  <div id="cart-overlay" class="cart-overlay"></div>
  <aside id="cart-drawer" class="cart-drawer" aria-label="Your cart">
    <div class="cart-head">
      <h3 id="cart-title"></h3>
      <button id="cart-close" class="cart-close" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items" class="cart-items"><!-- items injected --></div>
    <div class="cart-foot">
      <div class="cart-total-row">
        <span id="cart-total-label"></span>
        <span id="cart-total"></span>
      </div>
      <p id="cart-note" class="cart-note"></p>
      <button id="inquire-whatsapp" class="btn btn--wa btn--block"></button>
      <button id="inquire-email" class="btn btn--primary btn--block"></button>
    </div>
  </aside>

  <!-- ===== Book detail modal ===== -->
  <div id="detail-overlay" class="detail-overlay">
    <div class="detail-modal" role="dialog" aria-modal="true">
      <button id="detail-close" class="detail-close" aria-label="Close">✕</button>
      <div class="detail-body">
        <div class="detail-media">
          <div class="detail-figure">
            <div class="detail-stage" id="detail-stage">
              <img id="detail-img" class="detail-img" alt="" />
            </div>
            <button id="detail-prev" class="detail-nav prev" aria-label="Previous image">&#8249;</button>
            <button id="detail-next" class="detail-nav next" aria-label="Next image">&#8250;</button>
            <div id="detail-dots" class="detail-dots"></div>
          </div>
          <p id="detail-price" class="detail-price"></p>
          <button id="detail-add" class="add-btn btn btn--primary detail-buy">Add to Order</button>
        </div>
        <div class="detail-info">
          <h3 id="detail-title" class="detail-title"></h3>
          <p id="detail-desc" class="detail-desc"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating WhatsApp contact -->
  <a id="wa-float" class="wa-float" href="#" target="_blank" rel="noopener" aria-label="Message us on WhatsApp">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path fill="#fff" d="M16 3C9.4 3 4 8.4 4 15c0 2.1.6 4.2 1.6 6L4 29l8.2-1.6c1.7.9 3.7 1.4 5.8 1.4 6.6 0 12-5.4 12-12S22.6 3 16 3zm0 22c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-4.9.9.9-4.8-.2-.4C5.5 18.5 5 16.8 5 15 5 9 9.9 4 16 4s11 5 11 11-4.9 11-11 11zm6.1-8.3c-.3-.2-1.9-1-2.2-1.1-.3-.1-.5-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.3-.2-.3 0-.5.1-.7.1-.1.3-.4.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.8-1.9-1.1-2.6c-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.9-.8 2.1-1.5.3-.7.3-1.4.2-1.5-.1-.1-.3-.2-.6-.4z"/></svg>
  </a>

  <script src="config.js?v=36"></script>
  <script src="app.js?v=36"></script>
</body>
</html>
